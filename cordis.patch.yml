# dsh-extension-hub bundle patch: inserts the dual-face plugin row into the
# web profile roster. The node half (exports ".") runs in the host process and
# owns the skill filesystem operations, the plugin loader operations, and the
# /api/dsh-extension-hub route family; the browser half (exports "./client")
# registers the 「扩展管理」 settings section.
- insert:
    - id: extension-hub
      name: 'dsh-extension-hub'
