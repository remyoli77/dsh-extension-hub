# dsh-skill-manager bundle patch: inserts the dual-face plugin row into the
# web profile roster. The node half (exports ".") runs in the host process and
# owns the skill filesystem operations, the plugin loader operations, and the
# /api/dsh-skill-manager route family; the browser half (exports "./client")
# registers the 「技能」 settings section and the 「插件管理」 plugins tab.
- insert:
    - id: skill-manager
      name: 'dsh-skill-manager'
